name: secret-scan

# Scans every push and PR for leaked secrets, including TamRank Personal Access
# Tokens (tamrank_pat_), using the custom rule in .gitleaks.toml. The gitleaks
# binary is installed directly (not the marketplace action) so this runs free on
# a public org repo with no licence key.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks scans every commit

      - name: Run gitleaks
        run: |
          set -euo pipefail
          tag=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oE '"tag_name": *"v[0-9.]+"' | grep -oE 'v[0-9.]+')
          ver=${tag#v}
          echo "Using gitleaks ${tag}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${tag}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose
